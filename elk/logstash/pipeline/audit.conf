# ---------------------------------------------------------------------------
# MongoDB audit log -> Elasticsearch
#
# The consumer writes every applied event to MongoDB; this pipeline gives
# that log a declared shape and makes it searchable in Kibana.
# ---------------------------------------------------------------------------

input {
  mongodb {
    uri => "mongodb://${MONGO_USER}:${MONGO_PASSWORD}@northwind_audit:27017/${MONGO_DB}?authSource=admin"
    collection => "events"

    # The plugin tracks its position in a SQLite file keyed on the last _id
    # it read. The directory is a named volume, so a restart resumes rather
    # than starting again — and if it ever does start again, the document_id
    # below makes the replay overwrite instead of duplicate.
    placeholder_db_dir => "/usr/share/logstash/data"
    placeholder_db_name => "audit_placeholder.db"
    batch_size => 200
  }
}

filter {
  # Documents written before the payload field existed carry only the
  # plugin's lossy view of themselves. Indexing them would put truncated LSNs
  # beside correct ones, so they are dropped rather than half-trusted.
  if ![payload] {
    drop {}
  }

  # MongoDB's _id becomes the Elasticsearch document id. Kept in metadata,
  # since _id is reserved and Elasticsearch refuses a document that carries
  # it as a field.
  mutate {
    copy => { "_id" => "[@metadata][doc_id]" }
  }

  # Parse the untouched JSON into the root of the event. Fields with the same
  # name overwrite the plugin's type guesses: lsn is a string again, postcodes
  # keep their leading zeros, timestamps keep their milliseconds.
  json {
    source => "payload"
  }

  # Kibana's time axis should show when the event was applied, not when
  # Logstash happened to read it — which after an outage could be hours later.
  date {
    match    => ["applied_at", "ISO8601"]
    timezone => "UTC"
    target   => "@timestamp"
  }

  # What the plugin produced on its own and the payload has now replaced.
  prune {
    blacklist_names => [
      "^_id$", "^mongo_id$", "^log_entry$", "^logdate$", "^host$",
      "^payload$", "^data_", "^kafka_"
    ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]

    # Daily indices, named from @timestamp — which is the event's own time.
    # Naming from ingestion time would send a replayed document to a
    # different index than its first copy, where document_id could not
    # catch it.
    index       => "northwind-audit-%{+YYYY.MM.dd}"
    document_id => "%{[@metadata][doc_id]}"
    data_stream => false

    # The template is installed by the pipeline itself, so the mapping is
    # in git and in force before the first document arrives.
    manage_template    => true
    template           => "/usr/share/logstash/templates/northwind-audit.json"
    template_name      => "northwind-audit"
    template_overwrite => true
  }
}